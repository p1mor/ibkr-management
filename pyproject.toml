[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-management"
version = "0.1.0"
description = "IBKR market-data foundation"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "venv",
  "data",
  "src/ibkr_management/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
